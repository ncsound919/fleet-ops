name: ecosystem-watch

# Nightly, API-only sweep across every owned repo: dependency + secret-scanning
# alerts, staleness, most recent CI result, open PRs. No checkout, so it costs
# seconds per repo. This is the "stay on top of it" clock; it runs on GitHub's
# hardware, not the operator's laptop.
#
# Full checkout/build/test is a separate workflow: ecosystem-sweep.yml.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: Comma-separated repo names to restrict to (blank = all owned, non-fork, non-archived)
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: ecosystem-watch
  cancel-in-progress: false

env:
  ORG: ncsound919
  WATCH_TITLE: 'Ecosystem Watch'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          WANT='${{ github.event.inputs.repos }}'
          if [ -n "$WANT" ]; then
            JSON=$(printf '%s' "$WANT" | jq -cR 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')
          else
            JSON=$(gh repo list "$ORG" --limit 300 --json name,isFork,isArchived \
              --jq '[.[] | select((.isFork|not) and (.isArchived|not)) | .name]')
          fi
          echo "repos=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "targets: $(jq -r 'join(", ")' <<<"$JSON")"
      - name: refuse a vacuous sweep
        run: |
          set -euo pipefail
          n='${{ steps.list.outputs.count }}'
          if [ "$n" -le 0 ]; then echo "::error::no repos resolved - refusing a vacuous pass"; exit 1; fi

  watch:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: API metadata sweep
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          f=report.md
          {
            echo "## Ecosystem Watch - nightly"
            echo "checked ${{ needs.discover.outputs.count }} repositories - $(date -u +%FT%TZ)"
            echo
            echo "| repo | priv | dep | secret | stale(d) | last run | PRs |"
            echo "|---|---|---|---|---|---|---|"
          } > "$f"
          for r in $(jq -r '.[]' <<<'${{ needs.discover.outputs.repos }}'); do
            priv=$(gh api "repos/$ORG/$r" --jq '.private' 2>/dev/null || echo '?')
            pushed=$(gh api "repos/$ORG/$r" --jq '.pushed_at' 2>/dev/null || echo '')
            if [ -n "$pushed" ]; then days=$(( ( $(date +%s) - $(date -d "$pushed" +%s) ) / 86400 )); else days='?'; fi
            dep=$(gh api "repos/$ORG/$r/dependabot/alerts?state=open&per_page=100" --jq 'length' 2>/dev/null || echo '?')
            sec=$(gh api "repos/$ORG/$r/secret-scanning/alerts?state=open&per_page=100" --jq 'length' 2>/dev/null || echo '?')
            run=$(gh run list -R "$ORG/$r" -L1 --json conclusion,status,workflowName --jq '.[0] | "\(.workflowName):\(.conclusion // .status)"' 2>/dev/null || echo 'none')
            prs=$(gh pr list -R "$ORG/$r" --state open --json number --jq 'length' 2>/dev/null || echo '?')
            echo "| $r | $priv | $dep | $sec | $days | $run | $prs |" >> "$f"
          done
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: upsert tracking issue
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          body="$(cat report.md)"
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$WATCH_TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo '')
          if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$WATCH_TITLE" --body "$body"; fi
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-report
          path: report.md
          if-no-files-found: error
