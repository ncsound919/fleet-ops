name: ecosystem-watch

# Central clock for the BUSINESS ecosystem. Runs on GitHub's hardware, not the
# operator's laptop (which cannot stay up). Two speeds:
#
#   * nightly (cron 09:17 UTC)  -> API-only metadata sweep. No checkout, so it
#     costs ~seconds per repo. Dependency + secret alerts, staleness, recent CI
#     failures, open PRs. This is the "stay on top of it" lane.
#   * weekly (cron Sun 10:00 UTC) or workflow_dispatch full=true -> matrix
#     checkout of every owned repo and the portable gate (hygiene, gitleaks,
#     node/python build+test, boundary-test signal). This is the expensive lane;
#     mind the private-repo minutes (Free = 2000/mo - see README).
#
# Honesty rules baked in (see Coding lessons):
#   - a sweep that resolves zero repos FAILS rather than passing vacuously;
#   - one repo failing never hides the others (fail-fast: false);
#   - a repo that errors is reported as ERROR, never silently omitted;
#   - the report carries the denominator (checked / total).

on:
  schedule:
    - cron: '17 9 * * *'   # nightly light
    - cron: '0 10 * * 0'   # weekly full (Sunday)
  workflow_dispatch:
    inputs:
      full:
        description: Run the full checkout sweep (build + test)
        type: choice
        options: ['false', 'true']
        default: 'false'
      repos:
        description: Comma-separated repo names to restrict to (blank = all owned, non-fork, non-archived)
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: ecosystem-watch
  cancel-in-progress: false

env:
  ORG: ncsound919
  WATCH_TITLE: 'Ecosystem Watch'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          WANT='${{ github.event.inputs.repos }}'
          if [ -n "$WANT" ]; then
            JSON=$(printf '%s' "$WANT" | jq -cR 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))')
          else
            JSON=$(gh repo list "$ORG" --limit 300 \
              --json name,isFork,isArchived \
              --jq '[.[] | select((.isFork|not) and (.isArchived|not)) | .name]')
          fi
          echo "repos=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$JSON")" >> "$GITHUB_OUTPUT"
          echo "targets: $(jq -r 'join(", ")' <<<"$JSON")"
      - name: refuse a vacuous sweep
        run: |
          set -euo pipefail
          n='${{ steps.list.outputs.count }}'
          if [ "$n" -le 0 ]; then
            echo "::error::no repos resolved - refusing a vacuous pass"
            exit 1
          fi

  # ---------------------------------------------------------------- nightly
  nightly:
    needs: discover
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 9 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.full != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: API metadata sweep
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          f=watch-nightly.md
          {
            echo "## Ecosystem Watch - nightly (API); $(date -u +%FT%TZ)"
            echo
            echo "| repo | priv | dep | secret | stale(d) | last run | PRs |"
            echo "|---|---|---|---|---|---|---|"
          } > "$f"
          for r in $(jq -r '.[]' <<<'${{ needs.discover.outputs.repos }}'); do
            pushed=$(gh api "repos/$ORG/$r" --jq '.pushed_at' 2>/dev/null || echo '')
            priv=$(gh api "repos/$ORG/$r" --jq '.private' 2>/dev/null || echo '?')
            if [ -n "$pushed" ]; then
              days=$(( ( $(date +%s) - $(date -d "$pushed" +%s) ) / 86400 ))
            else
              days='?'
            fi
            dep=$(gh api "repos/$ORG/$r/dependabot/alerts?state=open&per_page=100" --jq 'length' 2>/dev/null || echo '?')
            sec=$(gh api "repos/$ORG/$r/secret-scanning/alerts?state=open&per_page=100" --jq 'length' 2>/dev/null || echo '?')
            run=$(gh run list -R "$ORG/$r" -L1 --json conclusion,status,workflowName \
              --jq '.[0] | "\(.workflowName):\(.conclusion // .status)"' 2>/dev/null || echo 'none')
            prs=$(gh pr list -R "$ORG/$r" --state open --json number --jq 'length' 2>/dev/null || echo '?')
            echo "| $r | $priv | $dep | $sec | $days | $run | $prs |" >> "$f"
          done
          echo "checked $(jq 'length' <<<'${{ needs.discover.outputs.repos }}') repositories" >> "$f"
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload nightly report
        uses: actions/upload-artifact@v4
        with:
          name: watch-nightly
          path: watch-nightly.md
          if-no-files-found: error

  # ------------------------------------------------------------------ full
  sweep:
    needs: discover
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.discover.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/${{ matrix.repo }}
          token: ${{ secrets.FLEET_PAT }}
          fetch-depth: 0

      - name: hygiene - reject tracked secrets
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '(\.env$|\.pem$|id_rsa|\.key$|secrets\.json$|cred\.txt$)' | grep -v '\.env\.example' || true)
          if [ -n "$bad" ]; then echo "TRACKED SECRETS:"; echo "$bad"; exit 1; fi
          echo "hygiene ok"

      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --redact --exit-code 1 --verbose

      - name: node checks
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail
          if [ -f bun.lockb ]; then PM="bun"; elif [ -f pnpm-lock.yaml ]; then PM="pnpm"; elif [ -f yarn.lock ]; then PM="yarn"; else PM="npm"; fi
          echo "package manager: $PM"
          node -v
          case "$PM" in
            bun)  npm i -g bun; bun install ;;
            pnpm) npm i -g pnpm; pnpm install --frozen-lockfile || pnpm install ;;
            yarn) npm i -g yarn; yarn install --frozen-lockfile || yarn install ;;
            npm)  npm ci || npm install ;;
          esac
          # typecheck / lint only if declared; a missing script is not a pass, it is "absent".
          for s in typecheck lint; do
            if node -e "process.exit(require('./package.json').scripts?.['$s']?0:1)"; then
              echo "::group::$s"; $PM run $s; echo "::endgroup::"
            else
              echo "no '$s' script (absent, not passed)"
            fi
          done
          if node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            echo "::group::test"; $PM test; echo "::endgroup::"
          else
            echo "no 'test' script (absent, not passed)"
          fi

      - name: python checks
        if: hashFiles('pyproject.toml') != '' || hashFiles('requirements*.txt') != ''
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          [ -f requirements.txt ] && python -m pip install -q -r requirements.txt || true
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            python -m pytest -q
          else
            echo "no python tests found (absent, not passed)"
          fi

      - name: boundary-test signal
        # The #1 defect class from the lessons window: a "passing" suite that never
        # touches the real artifact. Report (do not yet gate) whether any test
        # spawns a real process/engine, and how many test files exist.
        run: |
          set -euo pipefail
          tests=$(find . -path ./node_modules -prune -o \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name 'test_*.py' -o -name '*_test.py' -o -name '*Tests.cpp' \) -print 2>/dev/null | wc -l)
          spawns=$(grep -RIlE 'child_process|execa|spawnSync|\bspawn\(|subprocess\.|ProcessStartInfo|process\.spawn' --include='*.test.*' --include='test_*.py' --include='*_test.py' . 2>/dev/null | wc -l)
          echo "test_files=$tests spawns_real_process=$spawns" | tee report.txt
          jq -n --arg repo "${{ matrix.repo }}" --argjson tests "$tests" --argjson spawns "$spawns" \
            '{repo:$repo, test_files:$tests, spawns_real_process:$spawns}' > watch-report.json

      - name: upload sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-${{ matrix.repo }}
          path: watch-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------- report
  report:
    needs: [discover, nightly, sweep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arts
          merge-multiple: false

      - name: aggregate + publish
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          out=report.md
          {
            echo "## Ecosystem Watch - summary"
            echo "targets: ${{ needs.discover.outputs.count }} | run: ${{ github.run_id }}"
            echo
          } > "$out"
          if [ -f arts/watch-nightly/watch-nightly.md ]; then cat arts/watch-nightly/watch-nightly.md >> "$out"; fi
          if ls arts/watch-*/watch-report.json >/dev/null 2>&1; then
            echo >> "$out"; echo "### boundary-test signal (tests that spawn a real process)" >> "$out"
            echo "| repo | test files | spawns real process |" >> "$out"; echo "|---|---|---|" >> "$out"
            for j in arts/watch-*/watch-report.json; do
              echo "| $(jq -r '.repo' "$j") | $(jq -r '.test_files' "$j") | $(jq -r '.spawns_real_process' "$j") |" >> "$out"
            done
          fi
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: upsert tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          set -euo pipefail
          # Report-only for now: the watch observes and reports; it does not yet
          # enqueue repairs (that stays gated until the verifier is trusted).
          body="$(cat report.md)"
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$WATCH_TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo '')
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$WATCH_TITLE" --body "$body"
          fi
